<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGradEmblem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0718" />
      <stop offset="50%" stop-color="#180b38" />
      <stop offset="100%" stop-color="#05010d" />
    </linearGradient>
    <linearGradient id="neonPurpleEmblem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="neonCyanEmblem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glowEmblem" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Hexagon Shield -->
  <polygon points="50,4 90,25 90,75 50,96 10,75 10,25" fill="url(#bgGradEmblem)" stroke="url(#neonPurpleEmblem)" stroke-width="2.5" filter="url(#glowEmblem)" />
  <polygon points="50,9 85,28 85,72 50,91 15,72 15,28" fill="none" stroke="url(#neonCyanEmblem)" stroke-width="1" stroke-dasharray="4 2" opacity="0.6" />

  <!-- Circuit Microchip Nodes -->
  <circle cx="50" cy="18" r="2.5" fill="#22d3ee" />
  <line x1="50" y1="18" x2="50" y2="28" stroke="#22d3ee" stroke-width="1.5" />
  
  <!-- Stylized "H" Cyber Emblem -->
  <path d="M 30,28 L 30,72 L 38,72 L 38,54 L 44,54 L 44,46 L 38,46 L 38,28 Z" fill="url(#neonPurpleEmblem)" filter="url(#glowEmblem)" />
  <path d="M 70,28 L 70,72 L 62,72 L 62,54 L 56,54 L 56,46 L 62,46 L 62,28 Z" fill="url(#neonPurpleEmblem)" filter="url(#glowEmblem)" />

  <!-- Central Circuit Core & Lightning Bolt -->
  <polygon points="46,36 58,36 50,50 56,50 42,66 46,52 40,52" fill="url(#neonCyanEmblem)" filter="url(#glowEmblem)" />

  <!-- Outer Corner Accents -->
  <circle cx="30" cy="28" r="2" fill="#c084fc" />
  <circle cx="70" cy="28" r="2" fill="#c084fc" />
  <circle cx="30" cy="72" r="2" fill="#c084fc" />
  <circle cx="70" cy="72" r="2" fill="#c084fc" />
</svg>
